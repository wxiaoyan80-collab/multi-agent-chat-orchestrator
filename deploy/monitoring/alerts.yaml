# 多智能体群聊 - Prometheus 兼容告警规则
# 指标命名与 specs/qa-e2e-pilot-monitoring.md §3.1 一致。
# 部署：加载到 Prometheus rule_files（或兼容告警栈），重载配置后生效。
# 验证：见 §3.4 告警验证用例。

groups:
  - name: multi-agent-chat-slo
    interval: 30s
    rules:
      # 错误率 >1% 触发 paging（硬性要求）
      - alert: ErrorRateHigh
        expr: |
          (
            sum(rate(multi_trigger_errors_total[5m]))
            /
            clamp_min(sum(rate(multi_trigger_requests_total[5m])), 1)
          ) > 0.01
        for: 5m
        labels:
          severity: critical
          paging: "true"
          service: multi-agent-chat
        annotations:
          summary: "多智能体群聊错误率超过 1%"
          description: "当前错误率 {{ $value | humanizePercentage }}，已持续 5 分钟（阈值 1%）。"

      - alert: RequestSuccessRateLow
        expr: |
          (
            1 - (
              sum(rate(multi_trigger_requests_total{status="completed"}[10m]))
              /
              clamp_min(sum(rate(multi_trigger_requests_total[10m])), 1)
            )
          ) > 0.01
        for: 10m
        labels:
          severity: critical
          paging: "true"
          service: multi-agent-chat
        annotations:
          summary: "多智能体群聊请求成功率低于 99%"
          description: "当前成功率 {{ $value | humanizePercentage }}（失败占比），已持续 10 分钟。"

      - alert: RequestLatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(multi_trigger_request_duration_seconds_bucket[10m])) by (le)
          ) > 30
        for: 10m
        labels:
          severity: warning
          paging: "false"
          service: multi-agent-chat
        annotations:
          summary: "多智能体群聊请求 p95 延迟超过 30s"
          description: "p95 延迟 {{ $value }} 秒，已持续 10 分钟。"

  - name: multi-agent-chat-cost
    interval: 30s
    rules:
      - alert: TooManyConcurrentAgents
        expr: max(multi_trigger_agents_in_flight) > 5
        for: 5m
        labels:
          severity: warning
          service: multi-agent-chat
        annotations:
          summary: "并发 agent 数超过上限 5"
          description: "当前并发 agent 数 {{ $value }}，超过默认上限 5。"

      - alert: BudgetWarning
        expr: multi_trigger_budget_usage_ratio > 0.8
        for: 2m
        labels:
          severity: warning
          service: multi-agent-chat
        annotations:
          summary: "工作区预算使用率超过 80%"
          description: "workspace={{ $labels.workspace }} 预算使用率 {{ $value | humanizePercentage }}。"

      - alert: BudgetExceeded
        expr: multi_trigger_budget_usage_ratio > 1
        for: 0s
        labels:
          severity: critical
          paging: "true"
          service: multi-agent-chat
        annotations:
          summary: "工作区预算已超限"
          description: "workspace={{ $labels.workspace }} 预算使用率 {{ $value | humanizePercentage }}，请立即限流或关闭开关。"

      - alert: CostEstimateDeviation
        expr: |
          (
            sum(rate(multi_trigger_actual_cost[15m]))
            /
            clamp_min(sum(rate(multi_trigger_estimated_cost[15m])), 1)
          ) > 1.5
        for: 15m
        labels:
          severity: warning
          service: multi-agent-chat
        annotations:
          summary: "实际成本显著高于预估"
          description: "实际/预估成本比 {{ $value }}，超过 1.5。"

  - name: multi-agent-chat-supervisor
    interval: 30s
    rules:
      - alert: SupervisorHighRejectRate
        expr: |
          (
            sum(rate(multi_trigger_task_review_total{action="reject"}[15m]))
            /
            clamp_min(sum(rate(multi_trigger_task_review_total[15m])), 1)
          ) > 0.5
        for: 15m
        labels:
          severity: warning
          service: multi-agent-chat
        annotations:
          summary: "Supervisor 任务打回率超过 50%"
          description: "当前打回率 {{ $value | humanizePercentage }}，可能意味着任务分派或 worker 质量有问题。"

      - alert: RequestsStuck
        expr: |
          max(multi_trigger_agents_in_flight) > 0
          and
          max_over_time(multi_trigger_agents_in_flight[15m])
            == min_over_time(multi_trigger_agents_in_flight[15m])
        for: 15m
        labels:
          severity: warning
          service: multi-agent-chat
        annotations:
          summary: "疑似请求堆积：进行中 agent 数 15 分钟无变化"
          description: "检查是否存在悬挂的审核任务或未完成的队列消费。"
